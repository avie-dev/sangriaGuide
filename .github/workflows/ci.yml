# Runs on every pull request: type-check, tracker check, calculator tests, and a full build (which
# fails on broken internal links and invalid game data). Pushes to main run the same checks in
# deploy.yml before publishing.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # The lockfile is written by npm 11; Node 22's bundled npm 10 reads it as out of sync.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
