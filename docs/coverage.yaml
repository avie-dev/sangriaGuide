# Article coverage matrix: the single source of truth for which pages the wiki will have.
#
# One entry per page. `npm run coverage` validates this file and regenerates the article
# tables in docs/progress.md. See docs/information-architecture.md for the reasoning.
#
# Fields
#   slug      URL path under the site root; the file is src/content/docs/<slug>.mdx
#             (a section overview is <section>/index.mdx and has slug "<section>")
#   title     page title
#   brief     brief item(s) it covers, as "<section letter>: <item>" from docs/master-prompt.md
#   sources   official source ids (src/data/official-sources.json)
#   needs     slugs a reader should know first (used for "read this first" links and the walkthrough order)
#   phase     the execution phase that writes it (4–8)
#   missing   open question ids (research/open-questions.md) or short notes
#   research  sources found (default when sources exist) | read | done
#   writing   — | draft | written
#   verified  — | partly checked | verified
#   built     — | page stub | published (tools: built | tested)

