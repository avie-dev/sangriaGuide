# Cost tables shown by <CostTable id="…" /> and reused by calculators.
# `rows` hold numbers exactly as the sources state them. `total` is checked against the rows
# at build time when every row has a cost. Leave a cost as null when the source doesn't give it.

- id: class-evolution
  title: Class evolution tributes
  currency: ourosangue
  rowLabel: Evolution
  rows:
    - { label: Evolution I, cost: 15000 }
    - { label: Evolution II, cost: 30000 }
    - { label: Evolution III, cost: 45000 }
  total: 90000
  note: Per class. Paid at the last step of each evolution quest, from the Bank.
  sources: [classes, class-hub]

- id: class-switch
  title: Switching to a class you have already unlocked
  currency: ourosangue
  rowLabel: Action
  rows:
    - { label: Switch class, cost: 3000 }
  note: The first class, chosen during The Path of Blood, is free.
  sources: [classes]

- id: character-prestige
  title: Character prestige costs
  currency: ourosangue
  rowLabel: Prestige
  rows:
    - { label: 'Prestige 1', cost: 75 }
    - { label: 'Prestiges 2–19', cost: null }
    - { label: 'Prestige 20', cost: 4467 }
  total: 22760
  note: The official guide gives only the first and last cost and the total for all 20. Type `.level` in game to see your next prestige's cost.
  missing: [Q-017]
  sources: [nivel-e-prestigio]

- id: transfusion
  title: Transfusion cost
  currency: ourosangue
  rowLabel: Player
  rows:
    - { label: Without VIP, cost: 10000 }
    - { label: With VIP, cost: 8000 }
  note: Each Transfusion also needs 10 Pulses and yields 10 Plasmas. The limit is 250 Transfusions.
  sources: [transfusao-e-plasmas]

- id: vault
  title: Vault purchase
  currency: ourosangue
  rowLabel: Vault
  rows:
    - { label: 'Small vault (up to 4 chests)', cost: 5000 }
    - { label: 'Large vault (up to 14 chests)', cost: 10000 }
    - { label: 'Each extra chest', cost: 20000 }
  note: One-time payments, no rent. The first chest comes with the vault. Requires Viktor's quest Worthy of a Vault first.
  sources: [cofre]

- id: vault-chest-expansion
  title: Expanding one vault chest (21 to 77 slots)
  currency: ourosangue
  rowLabel: Expansion (+7 slots each)
  rows:
    - { label: '1st (28 slots)', cost: 2500 }
    - { label: '2nd (35 slots)', cost: 5000 }
    - { label: '3rd (42 slots)', cost: 7500 }
    - { label: '4th (49 slots)', cost: 10000 }
    - { label: '5th (56 slots)', cost: 12500 }
    - { label: '6th (63 slots)', cost: 15000 }
    - { label: '7th (70 slots)', cost: 17500 }
    - { label: '8th (77 slots)', cost: 20000 }
  total: 90000
  note: Per chest.
  sources: [cofre]

- id: mobile-depot
  title: Mobile Depot (5 to 27 slots)
  currency: ourosangue
  rowLabel: Step
  rows:
    - { label: 'Purchase (5 slots)', cost: 10000 }
    - { label: '1st expansion', cost: 10000 }
    - { label: '2nd expansion', cost: 15000 }
    - { label: '3rd expansion', cost: 20000 }
    - { label: '4th expansion', cost: 25000 }
    - { label: '5th expansion (27 slots)', cost: 30000 }
  total: 110000
  note: Vault owners only. The guide doesn't give the slot count after each expansion, only 5 at purchase and 27 after the fifth.
  sources: [cofre]

- id: profession-prestige
  title: Profession prestige
  currency: sangricoins
  rowLabel: Prestige
  rows:
    - { label: 'Each prestige (1–10)', cost: 75 }
  note: Per profession; 750 Sangricoins for all ten. Paid from the Bank at level 100, with no confirmation.
  sources: [profissoes]

- id: fortification
  title: Gear fortification
  currency: ourosangue
  rowLabel: Fortification
  rows:
    - { label: 'Per level gained (P1–P10)', cost: 2000 }
  note: Per piece; P0 to P10 costs 20,000. You can fortify up to your craft prestige. The Tailor pays per armour piece. Hiring a provider adds their price.
  sources: [oficios-ferreiro-alfaiate-encantador, servicos-de-profissao]
